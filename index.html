<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Firebase</title>
  <meta name="description" content="Ứng dụng nhắn tin realtime bằng Firebase Realtime Database">
  <style>
    :root{--primary:#2563eb;--primary2:#1d4ed8;--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e5eaf2;--danger:#dc2626;--success:#16a34a}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:min(440px,100%);background:var(--card);border-radius:22px;padding:30px;box-shadow:0 18px 60px #17203318}
    .brand{text-align:center;margin-bottom:24px}.brand .logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--primary),#60a5fa);display:grid;place-items:center;color:white;font-size:28px;margin:0 auto 12px}
    h1,h2,h3,p{margin-top:0}.brand h1{margin-bottom:6px}.brand p{color:var(--muted)}
    .tabs{display:flex;background:#eef2f7;padding:4px;border-radius:12px;margin-bottom:20px}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px #00000010;font-weight:700}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;outline:0;background:#fff}.field:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #2563eb12}
    .btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700}.btn-primary{background:var(--primary);color:#fff;width:100%;margin-top:18px}.btn-primary:hover{background:var(--primary2)}
    .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px}.msg.error{background:#fef2f2;color:#991b1b}.msg.ok{background:#f0fdf4;color:#166534}
    .app{height:100vh;display:grid;grid-template-columns:320px 1fr;overflow:hidden}.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
    .side-head{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.me{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800;flex:none}
    .me small{display:block;color:var(--muted);margin-top:2px}.icon-btn{border:0;background:#f3f6fb;border-radius:10px;width:38px;height:38px}
    .side-tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:10px;gap:6px}.side-tabs button{border:0;background:transparent;padding:9px 5px;border-radius:9px;color:var(--muted);font-size:12px}.side-tabs button.active{background:#eff6ff;color:var(--primary);font-weight:700}
    .panel{padding:0 12px 12px;overflow:auto}.search{margin:0 6px 10px}.list-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin:3px 0}.list-item:hover{background:#f6f8fb}.list-item.active{background:#eff6ff}.item-main{min-width:0;flex:1}.item-main strong,.item-main span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main span{font-size:12px;color:var(--muted);margin-top:2px}
    .badge{background:#2563eb;color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:11px}.mini-actions{display:flex;gap:5px}.mini-actions button{border:0;border-radius:8px;padding:6px 8px;font-size:11px}.accept{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}
    .chat{display:flex;flex-direction:column;min-width:0}.chat-head{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px}.chat-head .status{font-size:12px;color:var(--success)}
    .messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:7px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:360px}.bubble-row{display:flex}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(72%,520px);padding:9px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:var(--primary);color:#fff;border-color:var(--primary);border-bottom-right-radius:5px}.bubble-row:not(.mine) .bubble{border-bottom-left-radius:5px}.time{font-size:10px;color:var(--muted);margin:2px 7px 8px}.mine + .time{text-align:right}
    .composer{background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}.composer input{flex:1}.send{width:48px;background:var(--primary);color:#fff;border:0;border-radius:11px}
    .mobile-back{display:none}
    .avatar{font-size:18px}
    .link-btn{background:none;border:0;color:var(--primary);font-size:12px;font-weight:700;padding:0;cursor:pointer}
    .hint-row{display:flex;justify-content:flex-end;margin-top:8px}
    .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0 4px}
    .avatar-grid button{border:2px solid transparent;background:#f3f6fb;border-radius:10px;font-size:19px;padding:6px 0}
    .avatar-grid button.selected{border-color:var(--primary);background:#eff6ff}
    .section-title{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 4px;text-transform:uppercase;letter-spacing:.03em}
    .last-seen{font-size:11px;color:var(--muted);white-space:nowrap}
    .online-dot{color:var(--success);font-size:11px;white-space:nowrap}
    .tick{font-size:10px;margin-left:4px}
    .tick.seen{color:#60a5fa}
    .tick.delivered{color:var(--muted)}
    .tick.sent{color:var(--muted)}
    .bubble-wrap{position:relative;display:inline-block;max-width:100%}
    .msg-actions{position:absolute;top:-9px;right:-7px;display:none;gap:3px}
    .bubble-row:hover .msg-actions{display:flex}
    .msg-actions button{border:0;background:#0f172a;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;line-height:18px;padding:0}
    .deleted-text{font-style:italic;color:var(--muted)}
    .composer{position:relative}
    .composer textarea.field{resize:none;max-height:110px;line-height:1.4}
    .emoji-btn{width:40px;background:#f3f6fb;border:0;border-radius:11px;font-size:18px;flex:none}
    .emoji-popup{position:absolute;bottom:64px;left:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 12px 30px #17203324;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
    .emoji-popup button{border:0;background:transparent;font-size:19px;border-radius:8px;padding:5px}
    .emoji-popup button:hover{background:#f3f6fb}
    .toast-wrap{position:fixed;top:18px;right:18px;z-index:40;display:flex;flex-direction:column;gap:8px}
    .toast{background:#172033;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 12px 30px #17203340;max-width:280px;animation:toastIn .2s ease-out}
    @keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    .list-item .reject{flex:none}
    .modal{position:fixed;inset:0;background:#0f172a66;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head button{border:0;background:#f3f6fb;border-radius:8px;width:34px;height:34px}
    @media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:flex}.chat{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .chat{display:flex}.mobile-back{display:block;border:0;background:#f3f6fb;border-radius:9px;width:38px;height:38px}.chat-head{padding:0 12px}}
  </style>
</head>
<body>
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="logo">💬</div><h1>Chat Firebase</h1><p>Kết bạn và nhắn tin realtime</p></div>
    <div class="tabs"><button id="loginTab" class="active">Đăng nhập</button><button id="registerTab">Đăng ký</button></div>
    <form id="authForm">
      <div id="nameWrap" class="hidden"><label>Tên hiển thị</label><input id="displayName" class="field" maxlength="40" placeholder="Nguyễn Văn A"></div>
      <label>Email</label><input id="email" class="field" type="email" required placeholder="you@example.com">
      <label>Mật khẩu</label><input id="password" class="field" type="password" minlength="6" required placeholder="Tối thiểu 6 ký tự">
      <div class="hint-row"><button type="button" id="forgotBtn" class="link-btn">Quên mật khẩu?</button></div>
      <button class="btn btn-primary" id="authSubmit">Đăng nhập</button>
      <div id="authMsg"></div>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="side-head">
      <div class="me"><div id="myAvatar" class="avatar">U</div><div><strong id="myName">User</strong><small id="myEmail"></small></div></div>
      <button class="icon-btn" id="logoutBtn" title="Đăng xuất">↪</button>
    </div>
    <div class="side-tabs">
      <button class="active" data-panel="friends">Bạn bè</button>
      <button data-panel="requests">Lời mời <span id="requestBadge" class="badge hidden">0</span></button>
      <button data-panel="find">Tìm bạn</button>
    </div>
    <div id="friendsPanel" class="panel"></div>
    <div id="requestsPanel" class="panel hidden">
      <div class="section-title">Lời mời đến</div>
      <div id="incomingList"></div>
      <div class="section-title">Đã gửi</div>
      <div id="outgoingList"></div>
    </div>
    <div id="findPanel" class="panel hidden">
      <div class="search"><input id="userSearch" class="field" placeholder="Tìm theo tên hoặc username..."></div>
      <div id="searchResults"></div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-head">
      <button id="backBtn" class="mobile-back">‹</button>
      <div id="chatAvatar" class="avatar">?</div>
      <div><strong id="chatName">Chọn một người bạn</strong><div id="chatStatus" class="status"></div></div>
    </div>
    <div id="messages" class="messages">
      <div class="empty"><h2>💬</h2><p>Chọn một người bạn để bắt đầu cuộc trò chuyện.</p></div>
    </div>
    <form id="composer" class="composer hidden">
      <button type="button" id="emojiBtn" class="emoji-btn" title="Emoji">😊</button>
      <div id="emojiPopup" class="emoji-popup hidden"></div>
      <textarea id="messageInput" class="field" maxlength="2000" rows="1" placeholder="Nhập tin nhắn... (Shift+Enter để xuống dòng)"></textarea>
      <button class="send" type="submit">➤</button>
    </form>
  </main>
</div>

<div id="profileModal" class="modal hidden">
  <div class="modal-card" style="max-height:88vh;overflow:auto">
    <div class="modal-head"><h3>Hồ sơ</h3><button id="closeProfile">×</button></div>
    <form id="profileForm">
      <label>Ảnh đại diện</label>
      <div id="avatarGrid" class="avatar-grid"></div>
      <label>Tên hiển thị</label><input id="profileName" class="field" maxlength="40" required>
      <label>Username</label><input id="profileUsername" class="field" maxlength="24" pattern="[a-zA-Z0-9_]+" required>
      <label>Giới thiệu</label><input id="profileBio" class="field" maxlength="120" placeholder="Vài dòng về bạn...">
      <div class="section-title">Đổi mật khẩu (không bắt buộc)</div>
      <label>Mật khẩu hiện tại</label><input id="curPassword" class="field" type="password" autocomplete="current-password">
      <label>Mật khẩu mới</label><input id="newPassword" class="field" type="password" minlength="6" autocomplete="new-password">
      <button class="btn btn-primary">Lưu thay đổi</button>
      <div id="profileMsg"></div>
    </form>
  </div>
</div>

<div id="toastWrap" class="toast-wrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile, sendPasswordResetEmail, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getDatabase, ref, set, get, update, push, onValue, off, onDisconnect, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

/*
 * BẮT BUỘC: vào Firebase Console > Project settings > Your apps > Web app
 * và thay các giá trị TODO bằng Firebase Web App config của bạn.
 * Database URL của bạn đã được điền sẵn.
 */
const firebaseConfig = {
  apiKey: "AIzaSyCu8iMOK1e_LtN946q031xZUaXmpxaNw3g",
  authDomain: "messages-f01de.firebaseapp.com",
  databaseURL: "https://messages-f01de-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "messages-f01de",
  storageBucket: "messages-f01de.firebasestorage.app",
  messagingSenderId: "615968877992",
  appId: "1:615968877992:web:b48d7af77096a915a9c19d",
  measurementId: "G-R6J3M9V2VF"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = id => document.getElementById(id);
const AVATAR_OPTIONS=["😀","😎","🤓","🥳","🐱","🐶","🦊","🐼","🦁","🐨","🌟","🔥","🍀","🎧","🚀","🎨","⚡","🌈","🍉","🍕","⚽","🎮","📚","🎵"];
const EMOJI_QUICK=["😀","😂","🤣","😊","😍","🥰","😎","😭","😡","👍","❤️","🎉","🙏","😅","😉","🔥","👏","🤔"];
const state = { mode:"login", me:null, selected:null, selectedRoom:null, currentMessages:[], partnerSeenAt:0, partnerOnline:false, myHidden:{}, prevIncomingCount:null, messageUnsub:null, seenUnsub:null, partnerUnsub:null, hiddenUnsub:null, friendsUnsub:null, requestsUnsub:null, sentUnsub:null };

function showToast(text){
  const t=document.createElement("div"); t.className="toast"; t.textContent=text;
  $("toastWrap").appendChild(t);
  setTimeout(()=>t.remove(),4500);
}

function esc(s=""){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function initials(name="U"){return name.trim().split(/\s+/).slice(-2).map(x=>x[0]).join("").toUpperCase().slice(0,2)||"U";}
function avatarText(u){return u?.avatar || initials(u?.displayName);}
function roomId(a,b){return [a,b].sort().join("_");}
function fmtTime(ts){if(!ts)return "";const d=new Date(ts);return d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});}
function timeAgo(ts){if(!ts)return "";const diff=Math.max(0,Date.now()-ts);const m=Math.floor(diff/60000);if(m<1)return "vừa xong";if(m<60)return m+" phút trước";const h=Math.floor(m/60);if(h<24)return h+" giờ trước";const d=Math.floor(h/24);return d+" ngày trước";}
function showMsg(el,text,type="error"){el.innerHTML=`<div class="msg ${type}">${esc(text)}</div>`;}
function clearMsg(el){el.innerHTML="";}
function renderAvatarGrid(selected){
  $("avatarGrid").innerHTML=AVATAR_OPTIONS.map(e=>`<button type="button" data-avatar="${e}" class="${e===selected?"selected":""}">${e}</button>`).join("");
  $("avatarGrid").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("avatarGrid").querySelectorAll("button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");});
}
function selectedAvatar(){return $("avatarGrid").querySelector("button.selected")?.dataset.avatar || AVATAR_OPTIONS[0];}

function setMode(mode){
  state.mode=mode;
  $("loginTab").classList.toggle("active",mode==="login"); $("registerTab").classList.toggle("active",mode==="register");
  $("nameWrap").classList.toggle("hidden",mode==="login"); $("authSubmit").textContent=mode==="login"?"Đăng nhập":"Tạo tài khoản";
  $("forgotBtn").classList.toggle("hidden",mode!=="login");
  clearMsg($("authMsg"));
}
$("loginTab").onclick=()=>setMode("login"); $("registerTab").onclick=()=>setMode("register");
$("forgotBtn").onclick=async()=>{
  const email=$("email").value.trim() || prompt("Nhập email để đặt lại mật khẩu:");
  if(!email) return;
  try{ await sendPasswordResetEmail(auth,email); showMsg($("authMsg"),"Đã gửi email đặt lại mật khẩu, vui lòng kiểm tra hộp thư.","ok"); }
  catch(err){ showMsg($("authMsg"),firebaseError(err)); }
};

$("authForm").onsubmit=async e=>{
  e.preventDefault(); clearMsg($("authMsg"));
  try{
    const email=$("email").value.trim(), password=$("password").value;
    if(state.mode==="login") await signInWithEmailAndPassword(auth,email,password);
    else{
      const name=$("displayName").value.trim(); if(!name) throw new Error("Vui lòng nhập tên hiển thị.");
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(cred.user,{displayName:name});
      const base=(name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||"user");
      let candidate=base+Math.floor(Math.random()*10000), claimed=false;
      for(let i=0;i<5 && !claimed;i++){
        const result=await runTransaction(ref(db,`usernames/${candidate}`), cur=> cur===null ? cred.user.uid : undefined);
        if(result.committed) claimed=true; else candidate=base+Math.floor(Math.random()*100000);
      }
      const avatar=AVATAR_OPTIONS[Math.floor(Math.random()*AVATAR_OPTIONS.length)];
      await set(ref(db,`users/${cred.user.uid}`),{uid:cred.user.uid,displayName:name,username:candidate,email,createdAt:serverTimestamp(),online:true,avatar,bio:""});
    }
  }catch(err){showMsg($("authMsg"),firebaseError(err));}
};

function firebaseError(e){
  const map={"auth/email-already-in-use":"Email đã được sử dụng.","auth/invalid-credential":"Email hoặc mật khẩu không đúng.","auth/wrong-password":"Mật khẩu hiện tại không đúng.","auth/invalid-email":"Email không hợp lệ.","auth/user-not-found":"Không tìm thấy tài khoản với email này.","auth/weak-password":"Mật khẩu chưa đủ mạnh (tối thiểu 6 ký tự).","auth/requires-recent-login":"Vui lòng đăng xuất rồi đăng nhập lại để đổi mật khẩu.","auth/network-request-failed":"Không thể kết nối mạng."};
  return map[e.code]||e.message||"Có lỗi xảy ra.";
}

onAuthStateChanged(auth, async user=>{
  if(!user){$("authView").classList.remove("hidden");$("appView").classList.add("hidden");return;}
  $("authView").classList.add("hidden");$("appView").classList.remove("hidden");
  state.me=user;
  const snap=await get(ref(db,`users/${user.uid}`));
  if(!snap.exists()){
    const fallbackUsername="user_"+user.uid.slice(0,6);
    await runTransaction(ref(db,`usernames/${fallbackUsername}`), cur=> cur===null ? user.uid : undefined);
    await set(ref(db,`users/${user.uid}`),{uid:user.uid,displayName:user.displayName||"User",username:fallbackUsername,email:user.email,createdAt:serverTimestamp(),online:true,avatar:AVATAR_OPTIONS[0],bio:""});
  }
  const meSnap=await get(ref(db,`users/${user.uid}`)); const me=meSnap.val();
  $("myName").textContent=me.displayName||"User"; $("myEmail").textContent=me.email||user.email; $("myAvatar").textContent=avatarText(me);
  await update(ref(db,`users/${user.uid}`),{online:true,lastSeen:serverTimestamp()});
  setupPresence(user.uid);
  loadFriends(); loadRequests(); loadSentRequests();
});

function setupPresence(uid){
  onValue(ref(db,".info/connected"), snap=>{
    if(snap.val()===true){
      const myRef=ref(db,`users/${uid}`);
      onDisconnect(myRef).update({online:false,lastSeen:serverTimestamp()}).then(()=>{
        update(myRef,{online:true,lastSeen:serverTimestamp()});
      });
    }
  });
}

$("logoutBtn").onclick=async()=>{if(state.me)await update(ref(db,`users/${state.me.uid}`),{online:false,lastSeen:serverTimestamp()});await signOut(auth);};
$("backBtn").onclick=()=>{$("appView").classList.remove("chat-open");};

$("emojiBtn").onclick=()=>{
  if($("emojiPopup").classList.contains("hidden")){
    $("emojiPopup").innerHTML=EMOJI_QUICK.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join("");
    $("emojiPopup").querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const el=$("messageInput"); const start=el.selectionStart||el.value.length, end=el.selectionEnd||el.value.length;
      el.value=el.value.slice(0,start)+b.dataset.e+el.value.slice(end);
      el.focus(); el.selectionStart=el.selectionEnd=start+b.dataset.e.length;
      el.dispatchEvent(new Event("input"));
    });
  }
  $("emojiPopup").classList.toggle("hidden");
};
document.addEventListener("click",e=>{
  if(!e.target.closest("#emojiPopup") && e.target!==$("emojiBtn")) $("emojiPopup").classList.add("hidden");
});

document.querySelectorAll(".side-tabs button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".side-tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
  ["friends","requests","find"].forEach(x=>$(`${x}Panel`).classList.toggle("hidden",x!==btn.dataset.panel));
});

function loadFriends(){
  if(state.friendsUnsub) off(ref(db,`friendships/${state.me.uid}`),state.friendsUnsub);
  state.friendsUnsub=onValue(ref(db,`friendships/${state.me.uid}`),async snap=>{
    const ids=Object.keys(snap.val()||{}); const box=$("friendsPanel");
    if(!ids.length){box.innerHTML=`<div class="empty" style="margin:40px 10px"><p>Chưa có bạn bè.</p><small>Hãy vào “Tìm bạn” để kết bạn.</small></div>`;return;}
    const users=await Promise.all(ids.map(async id=>{const s=await get(ref(db,`users/${id}`));return s.exists()?s.val():null;}));
    box.innerHTML=users.filter(Boolean).map(u=>{
      const statusText=u.online?`<span class="online-dot">● Online</span>`:(u.lastSeen?`<span class="last-seen">${timeAgo(u.lastSeen)}</span>`:"");
      return `<div class="list-item ${state.selected?.uid===u.uid?"active":""}" data-uid="${u.uid}"><div class="avatar">${avatarText(u)}</div><div class="item-main"><strong>${esc(u.displayName)}</strong><span>@${esc(u.username||"")}</span></div>${statusText}<button type="button" class="reject" data-remove="${u.uid}" title="Xóa bạn" style="margin-left:6px">✕</button></div>`;
    }).join("");
    box.querySelectorAll(".list-item").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest("[data-remove]"))return;openChat(el.dataset.uid);}));
    box.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();removeFriend(b.dataset.remove);}));
  });
}

async function removeFriend(uid){
  if(!confirm("Xóa người này khỏi danh sách bạn bè?"))return;
  const updates={};
  updates[`friendships/${state.me.uid}/${uid}`]=null;
  updates[`friendships/${uid}/${state.me.uid}`]=null;
  await update(ref(db),updates);
}

function loadRequests(){
  if(state.requestsUnsub) off(ref(db,`friendRequests/${state.me.uid}`),state.requestsUnsub);
  state.requestsUnsub=onValue(ref(db,`friendRequests/${state.me.uid}`),async snap=>{
    const data=snap.val()||{}; const entries=Object.entries(data).filter(([,v])=>v.status==="pending");
    $("requestBadge").textContent=entries.length;$("requestBadge").classList.toggle("hidden",!entries.length);
    const box=$("incomingList");
    if(!entries.length){box.innerHTML=`<div class="empty" style="margin:20px 10px"><p>Không có lời mời kết bạn.</p></div>`;state.prevIncomingCount=0;return;}
    const users=await Promise.all(entries.map(async ([uid,v])=>{const s=await get(ref(db,`users/${uid}`));return [uid,v,s.val()];}));
    if(state.prevIncomingCount!==null && entries.length>state.prevIncomingCount){
      const sorted=[...users].sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
      const newest=sorted[0]?.[2]?.displayName||"Người dùng";
      showToast(`🔔 ${esc(newest)} đã gửi cho bạn một lời mời kết bạn`);
    }
    state.prevIncomingCount=entries.length;
    box.innerHTML=users.map(([uid,v,u])=>`<div class="list-item"><div class="avatar">${avatarText(u)}</div><div class="item-main"><strong>${esc(u?.displayName||"Người dùng")}</strong><span>muốn kết bạn</span></div><div class="mini-actions"><button class="accept" data-accept="${uid}">✓</button><button class="reject" data-reject="${uid}">×</button></div></div>`).join("");
    box.querySelectorAll("[data-accept]").forEach(b=>b.onclick=()=>respondRequest(b.dataset.accept,true));
    box.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>respondRequest(b.dataset.reject,false));
  });
}

function loadSentRequests(){
  if(state.sentUnsub) off(ref(db,`sentRequests/${state.me.uid}`),state.sentUnsub);
  state.sentUnsub=onValue(ref(db,`sentRequests/${state.me.uid}`),async snap=>{
    const data=snap.val()||{}; const entries=Object.entries(data).filter(([,v])=>v.status==="pending");
    const box=$("outgoingList");
    if(!entries.length){box.innerHTML=`<div class="empty" style="margin:20px 10px"><p>Không có lời mời nào đang chờ.</p></div>`;return;}
    const users=await Promise.all(entries.map(async ([uid])=>{const s=await get(ref(db,`users/${uid}`));return [uid,s.val()];}));
    box.innerHTML=users.map(([uid,u])=>`<div class="list-item"><div class="avatar">${avatarText(u)}</div><div class="item-main"><strong>${esc(u?.displayName||"Người dùng")}</strong><span>Đang chờ phản hồi</span></div><button type="button" class="reject" data-cancel="${uid}">Hủy</button></div>`).join("");
    box.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>cancelRequest(b.dataset.cancel));
  });
}

async function cancelRequest(uid){
  const updates={};
  updates[`friendRequests/${uid}/${state.me.uid}`]=null;
  updates[`sentRequests/${state.me.uid}/${uid}`]=null;
  await update(ref(db),updates);
}

async function respondRequest(uid,accept){
  const updates={};
  if(accept){updates[`friendships/${state.me.uid}/${uid}`]=true;updates[`friendships/${uid}/${state.me.uid}`]=true;}
  updates[`friendRequests/${state.me.uid}/${uid}/status`]=accept?"accepted":"rejected";
  updates[`sentRequests/${uid}/${state.me.uid}/status`]=accept?"accepted":"rejected";
  await update(ref(db),updates); loadFriends();
}

let searchTimer;
$("userSearch").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchUsers,250);};
async function searchUsers(){
  const term=$("userSearch").value.trim().toLowerCase(); const box=$("searchResults");
  if(term.length<2){box.innerHTML="";return;}
  const snap=await get(ref(db,"users")); const all=snap.val()||{};
  const result=Object.values(all).filter(u=>u.uid!==state.me.uid && ((u.displayName||"").toLowerCase().includes(term)||(u.username||"").toLowerCase().includes(term))).slice(0,30);
  if(!result.length){box.innerHTML=`<div class="empty" style="margin:30px 10px"><p>Không tìm thấy người dùng.</p></div>`;return;}
  const friends=await get(ref(db,`friendships/${state.me.uid}`)); const f=friends.val()||{};
  const sent=await get(ref(db,`sentRequests/${state.me.uid}`)); const sReq=sent.val()||{};
  const incoming=await get(ref(db,`friendRequests/${state.me.uid}`)); const iReq=incoming.val()||{};
  box.innerHTML=result.map(u=>{
    let action;
    if(f[u.uid]) action=`<span class="status">Bạn bè</span>`;
    else if(sReq[u.uid]?.status==="pending") action=`<span style="font-size:11px;color:var(--muted)">Đã gửi</span>`;
    else if(iReq[u.uid]?.status==="pending") action=`<span style="font-size:11px;color:var(--primary)">Đã gửi cho bạn</span>`;
    else action=`<button class="accept" style="border:0;padding:6px 9px;border-radius:8px" data-add="${u.uid}">+ Kết bạn</button>`;
    return `<div class="list-item"><div class="avatar">${avatarText(u)}</div><div class="item-main"><strong>${esc(u.displayName)}</strong><span>@${esc(u.username||"")}</span></div>${action}</div>`;
  }).join("");
  box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>sendRequest(b.dataset.add));
}
async function sendRequest(uid){
  const updates={};
  updates[`friendRequests/${uid}/${state.me.uid}`]={from:state.me.uid,status:"pending",createdAt:serverTimestamp()};
  updates[`sentRequests/${state.me.uid}/${uid}`]={to:uid,status:"pending",createdAt:serverTimestamp()};
  await update(ref(db),updates);
  searchUsers();
}

async function openChat(uid){
  const s=await get(ref(db,`users/${uid}`)); if(!s.exists())return;
  state.selected=s.val(); state.selectedRoom=roomId(state.me.uid,uid); state.partnerSeenAt=0; state.partnerOnline=!!state.selected.online; state.myHidden={};
  $("chatName").textContent=state.selected.displayName; $("chatName").title=state.selected.bio||"";
  $("chatStatus").textContent=state.selected.online?"● đang online":(state.selected.lastSeen?"Hoạt động "+timeAgo(state.selected.lastSeen):"");
  $("chatAvatar").textContent=avatarText(state.selected);$("composer").classList.remove("hidden");$("messages").innerHTML="";
  $("appView").classList.add("chat-open");

  if(state.messageUnsub) off(ref(db,`chats/${state.selectedRoom}/messages`),state.messageUnsub);
  if(state.seenUnsub) off(ref(db,`chats/${state.selectedRoom}/seenAt/${uid}`),state.seenUnsub);
  if(state.partnerUnsub) off(ref(db,`users/${uid}`),state.partnerUnsub);
  if(state.hiddenUnsub) off(ref(db,`chats/${state.selectedRoom}/hiddenFor/${state.me.uid}`),state.hiddenUnsub);

  const mref=ref(db,`chats/${state.selectedRoom}/messages`);
  state.messageUnsub=onValue(mref,snap=>{
    const data=snap.val()||{};
    state.currentMessages=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    renderMessages(); markSeen();
  });

  state.seenUnsub=onValue(ref(db,`chats/${state.selectedRoom}/seenAt/${uid}`),snap=>{
    state.partnerSeenAt=snap.val()||0; renderMessages();
  });

  state.partnerUnsub=onValue(ref(db,`users/${uid}`),snap=>{
    const u=snap.val(); if(!u)return;
    state.partnerOnline=!!u.online;
    $("chatStatus").textContent=u.online?"● đang online":(u.lastSeen?"Hoạt động "+timeAgo(u.lastSeen):"");
    renderMessages();
  });

  state.hiddenUnsub=onValue(ref(db,`chats/${state.selectedRoom}/hiddenFor/${state.me.uid}`),snap=>{
    state.myHidden=snap.val()||{}; renderMessages();
  });
}

function markSeen(){
  if(!state.selectedRoom) return;
  update(ref(db,`chats/${state.selectedRoom}/seenAt`),{[state.me.uid]:Date.now()});
}

function renderMessages(){
  const list=(state.currentMessages||[]).filter(m=>!state.myHidden[m.id]);
  $("messages").innerHTML=list.length?list.map(m=>{
    const mine=m.senderId===state.me.uid;
    const body=m.deleted?`<span class="deleted-text">Tin nhắn đã được thu hồi</span>`:esc(m.text);
    const recallBtn=(mine&&!m.deleted)?`<button type="button" data-recall="${m.id}" title="Thu hồi (2 phía)">↩</button>`:"";
    const deleteBtn=`<button type="button" data-delete="${m.id}" title="Xóa ở phía bạn">🗑</button>`;
    let tick="";
    if(mine&&!m.deleted){
      const seen=state.partnerSeenAt && m.createdAt<=state.partnerSeenAt;
      if(seen) tick=`<span class="tick seen">✓✓ Đã xem</span>`;
      else if(state.partnerOnline) tick=`<span class="tick delivered">✓✓ Đã nhận</span>`;
      else tick=`<span class="tick sent">✓ Đã gửi</span>`;
    }
    return `<div class="bubble-row ${mine?"mine":""}"><div class="bubble-wrap"><div class="bubble">${body}</div><div class="msg-actions">${recallBtn}${deleteBtn}</div></div></div><div class="time ${mine?"mine":""}">${fmtTime(m.createdAt)}${tick}</div>`;
  }).join(""):`<div class="empty"><p>Chưa có tin nhắn. Hãy bắt đầu cuộc trò chuyện!</p></div>`;
  $("messages").scrollTop=$("messages").scrollHeight;
  $("messages").querySelectorAll("[data-recall]").forEach(b=>b.onclick=()=>recallMessage(b.dataset.recall));
  $("messages").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteForMe(b.dataset.delete));
}

async function recallMessage(id){
  if(!confirm("Thu hồi tin nhắn này? Cả hai phía sẽ không còn thấy nội dung."))return;
  await update(ref(db,`chats/${state.selectedRoom}/messages/${id}`),{deleted:true,text:""});
}

async function deleteForMe(id){
  if(!confirm("Xóa tin nhắn này khỏi màn hình của bạn? (đối phương vẫn thấy bình thường)"))return;
  await update(ref(db,`chats/${state.selectedRoom}/hiddenFor`),{[`${state.me.uid}/${id}`]:true});
}

$("composer").onsubmit=async e=>{
  e.preventDefault(); const text=$("messageInput").value.trim(); if(!text||!state.selected)return;
  const base=`chats/${state.selectedRoom}`;
  const updates={};
  updates[`${base}/members/${state.me.uid}`]=true;updates[`${base}/members/${state.selected.uid}`]=true;
  const key=push(ref(db,`${base}/messages`)).key;
  updates[`${base}/messages/${key}`]={senderId:state.me.uid,text,createdAt:Date.now()};
  updates[`userChats/${state.me.uid}/${state.selected.uid}`]={roomId:state.selectedRoom,lastMessage:text,lastMessageAt:Date.now()};
  updates[`userChats/${state.selected.uid}/${state.me.uid}`]={roomId:state.selectedRoom,lastMessage:text,lastMessageAt:Date.now()};
  await update(ref(db),updates);$("messageInput").value="";$("messageInput").style.height="auto";
};
$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("composer").requestSubmit(); }
});
$("messageInput").addEventListener("input",()=>{ $("messageInput").style.height="auto"; $("messageInput").style.height=Math.min($("messageInput").scrollHeight,110)+"px"; });

// Hồ sơ: mở bằng double click vào khu vực tên của mình.
$("myName").ondblclick=async()=>{
  const s=await get(ref(db,`users/${state.me.uid}`));const u=s.val()||{};
  $("profileName").value=u.displayName||"";$("profileUsername").value=u.username||"";$("profileBio").value=u.bio||"";
  renderAvatarGrid(u.avatar||AVATAR_OPTIONS[0]);
  $("curPassword").value="";$("newPassword").value="";
  $("profileModal").classList.remove("hidden");
};
$("closeProfile").onclick=()=>$("profileModal").classList.add("hidden");
$("profileForm").onsubmit=async e=>{
  e.preventDefault();clearMsg($("profileMsg"));
  const name=$("profileName").value.trim();
  const username=$("profileUsername").value.trim().toLowerCase();
  const bio=$("profileBio").value.trim();
  const avatar=selectedAvatar();
  const curPass=$("curPassword").value, newPass=$("newPassword").value;
  try{
    const oldSnap=await get(ref(db,`users/${state.me.uid}/username`)); const oldUsername=oldSnap.val();
    if(username!==oldUsername){
      const result=await runTransaction(ref(db,`usernames/${username}`), cur=> cur===null ? state.me.uid : undefined);
      if(!result.committed) throw new Error("Username đã có người dùng, vui lòng chọn tên khác.");
      if(oldUsername) await set(ref(db,`usernames/${oldUsername}`),null);
    }
    await update(ref(db,`users/${state.me.uid}`),{displayName:name,username,bio,avatar});
    await updateProfile(state.me,{displayName:name});
    if(curPass && newPass){
      const cred=EmailAuthProvider.credential(state.me.email,curPass);
      await reauthenticateWithCredential(state.me,cred);
      await updatePassword(state.me,newPass);
    }
    showMsg($("profileMsg"),"Đã lưu.","ok");
    $("myName").textContent=name;$("myAvatar").textContent=avatar;
  }
  catch(err){showMsg($("profileMsg"),firebaseError(err)||err.message);}
};
</script>

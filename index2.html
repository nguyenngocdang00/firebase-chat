<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Web Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#4F46E5' }
                }
            }
        }
    </script>

    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Chat Bubble Animations */
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .message-bubble { animation: popIn 0.2s ease-out forwards; }
        
        /* Hide scrollbar for clean chat area */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen overflow-hidden flex items-center justify-center">

    <!-- ================= AUTH SCREEN ================= -->
    <div id="auth-screen" class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl transition-all duration-300">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-comments"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Chat App</h1>
            <p class="text-gray-500 mt-2">Đăng nhập bằng Username</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username-input" required pattern="^[a-z0-9]+$"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all lowercase"
                    placeholder="Ví dụ: ngocdang123">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password-input" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                        placeholder="••••••••">
                    <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" 
                class="w-full bg-primary hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md transition-all active:scale-95 flex justify-center items-center gap-2">
                <span>Đăng nhập</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-600">
            Chưa có tài khoản? <a href="#" class="text-primary font-semibold hover:underline">Đăng ký</a>
        </div>
    </div>

    <!-- ================= MAIN CHAT SCREEN ================= -->
    <div id="main-screen" class="hidden w-full h-full flex bg-white">
        
        <!-- SIDEBAR (List Chat) -->
        <div id="sidebar" class="w-full md:w-[350px] border-r border-gray-200 flex flex-col h-full bg-gray-50">
            <!-- Header Sidebar -->
            <div class="p-4 bg-white border-b border-gray-200 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 text-primary flex items-center justify-center font-bold text-lg" id="my-avatar">ND</div>
                    <span class="font-semibold text-gray-800" id="my-name">Ngọc Đang</span>
                </div>
                <div class="flex gap-2">
                    <button class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors"><i class="fa-solid fa-user-plus"></i></button>
                    <button id="btn-logout" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-red-100 hover:text-red-500 flex items-center justify-center text-gray-600 transition-colors"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
            
            <!-- Search -->
            <div class="p-3 bg-white">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" class="w-full bg-gray-100 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="Tìm kiếm cuộc trò chuyện...">
                </div>
            </div>

            <!-- List Conversations -->
            <div class="flex-1 overflow-y-auto">
                <!-- Chat Item Active -->
                <div class="flex items-center p-3 bg-indigo-50 border-l-4 border-primary cursor-pointer transition-colors">
                    <div class="relative">
                        <img src="https://i.pravatar.cc/150?img=11" class="w-12 h-12 rounded-full object-cover">
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    <div class="ml-3 flex-1 min-w-0">
                        <div class="flex justify-between items-baseline">
                            <h3 class="font-semibold text-gray-900 truncate">Global Room</h3>
                            <span class="text-xs text-gray-500">Vừa xong</span>
                        </div>
                        <p class="text-sm text-gray-600 truncate">Kênh chat chung demo realtime</p>
                    </div>
                </div>
                <!-- Mock item -->
                <div class="flex items-center p-3 hover:bg-gray-100 cursor-pointer transition-colors">
                    <div class="relative">
                        <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 font-bold">A</div>
                    </div>
                    <div class="ml-3 flex-1 min-w-0">
                        <div class="flex justify-between items-baseline">
                            <h3 class="font-medium text-gray-900 truncate">Nguyen Van A</h3>
                            <span class="text-xs text-gray-400">12:30</span>
                        </div>
                        <p class="text-sm text-gray-500 truncate">Tính năng chat 1-1 cần backend auth</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div id="chat-area" class="hidden md:flex flex-col flex-1 h-full bg-[#f4f7f6]">
            <!-- Header Chat -->
            <div class="p-4 bg-white border-b border-gray-200 flex justify-between items-center z-10 shadow-sm">
                <div class="flex items-center gap-3">
                    <button id="btn-back-mobile" class="md:hidden text-gray-500 p-2 -ml-2 hover:bg-gray-100 rounded-full">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="relative">
                        <img src="https://i.pravatar.cc/150?img=11" class="w-10 h-10 rounded-full object-cover">
                        <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    <div>
                        <h2 class="font-bold text-gray-800">Global Room</h2>
                        <p class="text-xs text-primary font-medium">Đang hoạt động</p>
                    </div>
                </div>
                <div class="flex gap-4 text-gray-500">
                    <button class="hover:text-primary transition-colors"><i class="fa-solid fa-phone"></i></button>
                    <button class="hover:text-primary transition-colors"><i class="fa-solid fa-video"></i></button>
                    <button class="hover:text-gray-800 transition-colors"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messages-list" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                <!-- Loading State (Tạm thời) -->
                <div class="flex justify-center items-center h-full text-gray-400 gap-2" id="loading-msg">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải tin nhắn...
                </div>
            </div>

            <!-- Chat Composer -->
            <div class="p-3 bg-white border-t border-gray-200">
                <form id="chat-form" class="flex items-end gap-2 bg-gray-100 p-1.5 rounded-2xl border border-gray-200 focus-within:border-primary focus-within:bg-white transition-colors">
                    <button type="button" class="p-2.5 text-gray-500 hover:text-primary transition-colors rounded-full"><i class="fa-solid fa-circle-plus text-xl"></i></button>
                    <button type="button" class="p-2.5 text-gray-500 hover:text-yellow-500 transition-colors rounded-full"><i class="fa-regular fa-face-smile text-xl"></i></button>
                    <textarea id="message-input" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 resize-none py-2.5 px-2 outline-none max-h-32 text-gray-700" placeholder="Nhập tin nhắn... (Shift+Enter để xuống dòng)"></textarea>
                    <button type="submit" id="btn-send" class="p-2.5 bg-primary text-white rounded-full hover:bg-indigo-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center w-10 h-10 shrink-0">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Dùng dạng module chuẩn ES6) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 1. FIREBASE CONFIGURATION
        // Thay thế bằng Config thật của bạn lấy từ Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSy_YOUR_API_KEY",
            authDomain: "your-app.firebaseapp.com",
            databaseURL: "https://your-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "your-app",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        // Bỏ comment dòng dưới và điền config thật để chạy Realtime
        // const app = initializeApp(firebaseConfig);
        // const db = getDatabase(app);

        // -- BIẾN TOÀN CỤC --
        let currentUser = null;

        // -- DOM ELEMENTS --
        const authScreen = document.getElementById('auth-screen');
        const mainScreen = document.getElementById('main-screen');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const messagesList = document.getElementById('messages-list');
        const loadingMsg = document.getElementById('loading-msg');
        
        // Element cho Mobile Responsive
        const sidebar = document.getElementById('sidebar');
        const chatArea = document.getElementById('chat-area');
        const btnBackMobile = document.getElementById('btn-back-mobile');

        // -- HÀM XỬ LÝ GIAO DIỆN --
        
        // Đăng nhập giả lập (Vì GitHub Pages không chạy được Cloud Functions)
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim().toLowerCase();
            if(username) {
                currentUser = {
                    uid: 'uid_' + Date.now(), // Fake UID
                    username: username,
                    avatarText: username.substring(0, 2).toUpperCase()
                };
                
                // Cập nhật UI
                document.getElementById('my-avatar').innerText = currentUser.avatarText;
                document.getElementById('my-name').innerText = username;
                
                // Chuyển màn hình
                authScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                
                // Xử lý responsive mobile: hiện chat area luôn nếu là mobile
                if (window.innerWidth < 768) {
                    sidebar.classList.add('hidden');
                    chatArea.classList.remove('hidden');
                    chatArea.classList.add('flex');
                }
                
                initChatRealtime();
            }
        });

        // Nút Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            currentUser = null;
            mainScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            messagesList.innerHTML = '';
        });

        // Logic Back Mobile
        btnBackMobile.addEventListener('click', () => {
            chatArea.classList.add('hidden');
            chatArea.classList.remove('flex');
            sidebar.classList.remove('hidden');
            sidebar.classList.add('flex');
        });

        // Xử lý Textarea tự tăng chiều cao
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 128 ? this.scrollHeight : 128) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // -- LOGIC REALTIME FIREBASE --
        function initChatRealtime() {
            // Xóa loading
            loadingMsg.style.display = 'none';

            // Lưu ý: Đây là Mock UI tĩnh cho GitHub Pages. 
            // Nếu bạn đã gắn Firebase Config ở trên, hãy bỏ comment phần code dưới đây.

            /* -- FIREBASE THẬT --
            const globalChatRef = ref(db, 'messages/global_room');
            
            // Lắng nghe tin nhắn mới
            onChildAdded(globalChatRef, (snapshot) => {
                const msg = snapshot.val();
                renderMessage(msg);
            });

            // Gửi tin nhắn
            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const text = messageInput.value.trim();
                if (!text) return;
                
                messageInput.value = '';
                messageInput.style.height = 'auto'; // Reset chiều cao

                await push(globalChatRef, {
                    senderId: currentUser.uid,
                    senderName: currentUser.username,
                    text: text,
                    timestamp: serverTimestamp()
                });
            });
            */

            // -- MOCK DATA CHẠY TẠM KHI CHƯA CÓ FIREBASE (Demo UI) --
            // Xóa phần này khi dùng Firebase thật
            renderMessage({ senderId: 'bot', senderName: 'Hệ thống', text: 'Chào mừng bạn đến với phòng chat Global Demo! UI đã sẵn sàng cho GitHub Pages.', timestamp: Date.now() });
            
            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = messageInput.value.trim();
                if (!text) return;
                
                messageInput.value = '';
                messageInput.style.height = 'auto';
                
                // Render tin nhắn của mình
                renderMessage({ senderId: currentUser.uid, senderName: currentUser.username, text: text, timestamp: Date.now() });
                
                // Giả lập bot trả lời sau 1 giây
                setTimeout(() => {
                    renderMessage({ senderId: 'bot', senderName: 'Bot', text: 'Đây là tin nhắn giả lập trả lời: ' + text, timestamp: Date.now() });
                }, 1000);
            });
        }

        // -- RENDER TIN NHẮN --
        function renderMessage(msg) {
            const isOwn = msg.senderId === currentUser.uid;
            
            const timeString = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col w-full message-bubble ${isOwn ? 'items-end' : 'items-start'}`;
            
            const contentHTML = isOwn ? `
                <div class="flex flex-col items-end max-w-[75%] md:max-w-[65%]">
                    <div class="bg-primary text-white rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-sm">
                        <p class="text-[15px] leading-relaxed break-words whitespace-pre-wrap">${escapeHTML(msg.text)}</p>
                    </div>
                    <div class="text-[11px] text-gray-400 mt-1 flex items-center gap-1">
                        ${timeString} <i class="fa-solid fa-check-double text-primary"></i>
                    </div>
                </div>
            ` : `
                <div class="flex gap-2 max-w-[75%] md:max-w-[65%]">
                    <div class="w-8 h-8 rounded-full bg-gray-200 shrink-0 flex items-center justify-center text-xs font-bold text-gray-500 mt-1">
                        ${msg.senderName.substring(0,2).toUpperCase()}
                    </div>
                    <div class="flex flex-col items-start">
                        <span class="text-xs text-gray-500 mb-1 ml-1">${msg.senderName}</span>
                        <div class="bg-white border border-gray-100 text-gray-800 rounded-2xl rounded-tl-sm px-4 py-2.5 shadow-sm">
                            <p class="text-[15px] leading-relaxed break-words whitespace-pre-wrap">${escapeHTML(msg.text)}</p>
                        </div>
                        <span class="text-[11px] text-gray-400 mt-1 ml-1">${timeString}</span>
                    </div>
                </div>
            `;
            
            msgDiv.innerHTML = contentHTML;
            messagesList.appendChild(msgDiv);
            
            // Scroll to bottom
            messagesList.scrollTo({ top: messagesList.scrollHeight, behavior: 'smooth' });
        }

        // Chống XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
</html>
